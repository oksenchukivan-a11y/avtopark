<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Рейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f3f0ea; --surface:#fff; --ink:#1f2d33; --muted:#5f6b70; --line:#dcd6cb;
  --accent:#0e7c6b; --accent-soft:#e3f1ec; --on-accent:#fff;
  --cash:#1c8a4b; --cash-soft:#dff3e6; --bank:#2f6fd0; --bank-soft:#e2ecfb;
  --debt:#c2322f; --debt-soft:#fbe6e5; --warn:#b7791f; --warn-soft:#fff2d6;
  --none:#8d8f94; --none-soft:#ecebe8;
}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2422; --ink:#e9efec; --muted:#9daaa5; --line:#2f3a37;
  --accent:#4cc3a9; --accent-soft:#17332d; --on-accent:#0f1a17;
  --cash:#58cf8a; --cash-soft:#173524; --bank:#7aa9f0; --bank-soft:#1b2c47;
  --debt:#f07470; --debt-soft:#3d1c1c; --warn:#e3a94f; --warn-soft:#3a2c14;
  --none:#8f969a; --none-soft:#262d2b; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0;font-weight:800}
.muted{color:var(--muted)} .small{font-size:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1{flex:1;min-width:0;line-height:1.2}
.icon{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:20px;display:grid;place-items:center;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.debt{border-color:var(--debt);background:var(--debt-soft)}
.card.ok{border-color:var(--cash);background:var(--cash-soft)}
.card.wait{background:var(--none-soft)}
.card b.h{display:block;margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.line span:last-child{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.count{font-size:22px;font-weight:800}
/* смужка з машинкою */
.track{position:relative;height:34px;margin:6px 0 2px}
.track i{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:8px;background:var(--line)}
.track u{position:absolute;left:0;top:20px;height:8px;border-radius:8px;background:var(--accent);transition:width .4s}
.track s{position:absolute;top:0;font-size:24px;text-decoration:none;transform:translateX(-50%) scaleX(-1);transition:left .4s}
.track em{position:absolute;right:-2px;top:2px;font-style:normal;font-size:18px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar u{display:block;height:100%;background:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{margin:0;padding:12px}
.two .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
/* рядок точки */
.row{display:flex;align-items:stretch;gap:8px;margin:8px 0}
.row .main{flex:1;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink);font:inherit}
.row .main.debt{border-left:6px solid var(--debt)}
.row .nm{font-weight:800;display:flex;justify-content:space-between;gap:10px}
.row .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.nopay{display:inline-block;background:#ffd84d;color:#3a2c00;font-weight:700;padding:0 8px;border-radius:8px;line-height:1.5}
.row .note{font-size:15px;font-weight:600;color:var(--ink);background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:6px;padding:4px 8px;margin-top:6px;white-space:normal;text-align:left}
.row .sub{font-size:14px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .call{width:56px;border-radius:16px;border:1px solid var(--cash);background:var(--cash-soft);font-size:24px;display:grid;place-items:center;text-decoration:none;color:inherit}
.row .call.edit{border-color:var(--bank);background:var(--bank-soft);font-size:22px;font-family:inherit}
.row .call.off{border-color:var(--line);background:var(--none-soft);opacity:.5}
.fold{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;font:inherit;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;margin-top:8px}
.red{color:var(--debt)} .green{color:var(--cash)} .blue{color:var(--bank)}
/* кнопки */
button{cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;font-weight:800;text-align:center;text-decoration:none;margin:8px 0}
.btn.go{background:var(--cash);border-color:var(--cash);color:#fff}
.btn.blue{background:var(--bank-soft);border-color:var(--bank);color:var(--bank)}
.btn.red{background:var(--debt-soft);border-color:var(--debt);color:var(--debt)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.left{justify-content:space-between;text-align:left}
.btn[disabled]{opacity:.45}
.btn.nophone{opacity:.55;border-style:dashed}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.calls .btn{margin:0;font-size:16px;min-height:52px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.dock .btn{margin:0;min-height:64px}
.dock .back{flex:0 0 34%;font-weight:700;font-size:17px}
.dock .go,.dock .wide{flex:1;font-size:19px}
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:8px 0;text-align:left}
.chk.on{border-color:var(--cash);background:var(--cash-soft)}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;flex:none}
.chk.on .box{background:var(--cash);border-color:var(--cash);color:#fff}
.chk .t{flex:1} .chk .s{font-weight:800;white-space:nowrap}
input.sum{width:100%;height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 28px system-ui;padding:0 16px;text-align:right}
input.sum:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:700;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.dim{opacity:.45}
textarea.note{width:100%;margin-top:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px system-ui;padding:12px}
#post::placeholder{font-size:17px;font-weight:600}
.linkish{display:block;background:none;border:0;padding:0;text-align:left;font:inherit;text-decoration:underline dotted}
.x{border:0;background:none;font-size:20px;color:var(--debt);padding:4px 8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:8}
.sheet>div{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.center{text-align:center;padding:40px 0}
.busy .btn,.busy .row .main,.busy .chk{pointer-events:none;opacity:.6}
</style>
</head>
<body>
<div id="main"><div class="center muted">Відкриваю рейс…</div></div>
<div id="dock" class="dock" hidden></div>
<div id="sheet"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const S = {run:null, menu:null, scr:"load", i:null, open:{}, sel:[], sum:"", kind:null, items:null, item:null, itemN:0, psel:{}, qty:1, exp:"Нова пошта", done:null, cfg:{}, veh:null, day:null};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(x){
  x = Math.round((+x || 0) * 100) / 100;
  const whole = Math.abs(x - Math.round(x)) < 0.005;
  let [a, b] = (whole ? String(Math.round(x)) : x.toFixed(2)).split(".");
  a = a.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return a + (b ? "," + b : "") + " ₴";
}
function plural(n, one, few, many){
  n = Math.abs(n); const d = n % 10, h = n % 100;
  if (d === 1 && h !== 11) return one;
  return d >= 2 && d <= 4 && !(h >= 12 && h <= 14) ? few : many;
}
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
function buzz(kind){ try { tg && tg.HapticFeedback && (kind ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.impactOccurred("light")); } catch(e){} }

let busy = false;
async function api(act, args){
  if (busy) return null;
  busy = true; document.body.classList.add("busy");
  try {
    const r = await fetch("api", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({init:INIT, act, args:args || {}})});
    const j = await r.json();
    if (j.cfg) S.cfg = j.cfg;
    if ("run" in j) S.run = j.run;
    if (j.menu) S.menu = j.menu;
    if (j.shut) { S.shut = j.msg; S.run = null; S.scr = "shut"; render(); return null; }
    if (!j.ok) { toast(j.msg || "Не вийшло"); buzz("error"); return null; }
    return j;
  } catch(e) { toast("Немає зв'язку. Спробуй ще раз."); buzz("error"); return null; }
  finally { busy = false; document.body.classList.remove("busy"); }
}
const stop = () => S.run && S.run.stops[S.i];

/* ---------- дзвінок ---------- */
function viaBrowser(){         // в айфонному Telegram посилання tel: не набирає — дзвонимо через сторінку в браузері
  const p = tg && tg.platform;
  return S.cfg.call === "browser" || p === "ios" || p === "macos";
}
function telAttrs(num){
  return viaBrowser() ? `data-a="dial" data-n="${esc(num)}"` : `href="tel:${esc(num)}"`;
}
function mgrBtns(st, names){       // кнопка на кожного менеджера; без телефону — пояснює, а не мовчить
  const list = st.mgrs.filter(m => !names || names.includes(m.name));
  return list.map(m => m.phone ? `<a class="btn blue" ${telAttrs(m.phone)}>📞 ${esc(m.label)}</a>`
    : `<button class="btn nophone" data-a="nophone" data-n="${esc(m.name)}">📞 ${esc(m.label)}</button>`).join("");
}
function callBtn(st, cls){
  const mg = st.mgrs.filter(m => m.phone), nums = st.phones.length + mg.length;
  if (!nums) return `<span class="${cls} off">📞</span>`;
  if (nums === 1) return `<a class="${cls}" ${telAttrs(st.phones[0] || mg[0].phone)}>📞</a>`;
  return `<a class="${cls}" data-a="who" data-i="${st.i}">📞</a>`;
}
function whoSheet(st){
  let h = `<div class="sheet" data-a="unsheet"><div><b>${esc(st.name)}</b>`;
  st.phones.forEach((p, k) => h += `<a class="btn go" ${telAttrs(p)}>📞 Салон${st.phones.length > 1 ? " " + (k + 1) : ""}</a>`);
  h += mgrBtns(st);
  return h + `<button class="btn" data-a="unsheet">Закрити</button></div></div>`;
}

/* ---------- екрани ---------- */
function vMenu(){
  const m = S.menu || {sheets:[]};
  let h = `<div class="top"><h1>🚚 Рейс</h1></div>`;
  if (m.locked)          // у рейсі вже є гроші чи відмітки — його не можна загубити
    return [h + `<div class="card debt"><b>У тебе відкритий рейс з відмітками.</b><div>Спершу здай у ньому касу.</div></div>`, [["back wide", "← До рейсу", "list"]]];
  if (S.run) h += `<div class="card debt">Відкритий рейс закриється, відмітки в ньому не збережуться.</div>`;
  if (m.note) h += `<div class="card">${esc(m.note)}</div>`;
  if (m.sheets.length) h += `<div class="muted">Яку путівку відкрити?</div>`;
  else if (!m.note) h += `<div class="card">Путівок на сьогодні ще немає.</div>`;
  m.sheets.forEach(s => {
    const mates = !m.people && s.mates && s.mates.length ? `<br><span class="small muted" style="font-weight:500">👥 удвох з ${esc(s.mates.join(", "))} · усе навпіл</span>` : "";
    h += `<button class="btn left" data-a="start" data-id="${esc(s.id)}"><span><b>${s.done ? "🏁" : "📄"} ${esc(s.title)}</b>${s.done ? ` <span class="small muted">касу здано</span>` : ""}${s.sub ? `<br><span class="small muted" style="font-weight:500">${esc(s.sub)}</span>` : ""}${mates}</span><span>›</span></button>`;
    if (m.people && s.id.startsWith("1c:")) {      // власник складає екіпаж: один або двоє водіїв
      const crew = s.crew || [], full = crew.length >= (m.crew_max || 2);
      h += `<div class="chips" style="margin:-2px 0 12px"><span class="small muted" style="align-self:center">Екіпаж:</span>${m.people.length ? m.people.map(p => {
        const on = crew.includes(p.id);
        return `<button class="chip${on ? " on" : ""}${!on && full ? " dim" : ""}" data-a="assign" data-id="${esc(s.id)}" data-to="${p.id}" data-on="${on ? 0 : 1}">👤 ${esc(p.name)}</button>`;
      }).join("") : `<span class="small muted" style="align-self:center">водіїв у рейсі ще немає</span>`}${crew.length > 1 ? `<span class="small muted" style="align-self:center">· усе навпіл</span>` : ""}</div>`;
    }
  });
  h += `<button class="btn left" data-a="start" data-id="demo"><span>🎓 Навчальний рейс</span><span>›</span></button>`;
  return [h, S.run ? [["back", "← Назад", "list"]] : []];
}
function rowHtml(st){
  const sub = [];
  if (st.debt > 0) sub.push(`<span class="red">🔴 борг ${money(st.debt)}</span>`);
  if (st.free && st.due > 0) sub.push(`<span class="nopay">без оплати</span>`);   // на папері це червона ручка — тут жовта плашка; якщо боргу немає, вона вже стоїть праворуч
  if (st.flags.length) sub.push("❗ " + esc(st.flags.join(", ")));
  if (st.addr) sub.push(esc(st.addr));
  const right = st.free && st.due <= 0 ? `<span class="nopay">без оплати</span>` : money(st.due);
  return `<div class="row"><button class="main${st.debt > 0 ? " debt" : ""}" data-a="open" data-i="${st.i}">
    <div class="nm"><span>${esc(st.name)}</span><span>${right}</span></div>
    <div class="sub">${sub.join(" · ")}</div>${(st.comments || []).map(c => `<div class="note">💬 ${esc(c)}</div>`).join("")}</button>${callBtn(st, "call")}</div>`;
}
function doneRow(st){
  const s = st.status, ico = s.cash > 0 ? (s.kind === "paid" ? "🟢" : "🟡") : (s.reason === "acct" ? "💳" : s.kind === "given" ? "⚪" : "🔴");
  return `<div class="row"><button class="main" data-a="open" data-i="${st.i}">
    <div class="nm"><span>${ico} ${esc(st.name)}</span><span>${s.cash > 0 ? money(s.cash) : ""}</span></div>
    <div class="sub">${esc(s.text)}</div></button></div>`;
}
function fold(key, label, n){
  return `<button class="fold" data-a="fold" data-k="${key}"><span>${label} · ${n}</span><span>${S.open[key] ? "▲" : "▼"}</span></button>`;
}
function vList(){
  const r = S.run, t = r.totals, st = r.stops;
  const todo = st.filter(s => s.where === "route" && !s.status), done = st.filter(s => s.status);
  const debt = st.filter(s => s.where === "debt" && !s.status).sort((a, b) => b.debt - a.debt), skip = st.filter(s => s.where === "skip");
  const pct = t.stops ? Math.round(100 * (t.stops - todo.length) / t.stops) : 100;
  let h = `<div class="top"><h1>${esc(r.title)}</h1><button class="icon" data-a="menu">⋯</button></div>
  ${S.cfg.daily && (r.vehicles || []).length ? `<button class="small muted linkish" data-a="veh" style="margin:-6px 0 10px">🚐 ${esc(r.vehicles.map(carName).join(", "))} · змінити</button>` : ""}
  ${r.crew && r.crew.length > 1 ? `<div class="small muted" style="margin:-6px 0 10px">👥 ${esc(r.crew.join(" + "))} · рейс і каса спільні, усе навпіл</div>` : ""}
  <div class="card"><div class="count">${todo.length ? `Лишилось ${todo.length} з ${t.stops}` : "Усі точки відмічено"}</div>
    <div class="track"><i></i><u style="width:${pct}%"></u><s style="left:${Math.min(96, Math.max(4, pct))}%">🚚</s><em>🏁</em></div></div>
  <div class="two"><div class="card"><div class="small muted">💰 Ще зібрати</div><div class="v">${money(r.left_sum)}</div></div>
    <div class="card"><div class="small muted">💵 Зібрано</div><div class="v green">${money(t.cash)}</div></div></div>`;
  todo.forEach(s => h += rowHtml(s));
  if (!todo.length) h += `<div class="card ok">🟢 Можна здавати касу</div>`;
  if (done.length) { h += fold("done", "Відмічено", done.length); if (S.open.done) done.forEach(s => h += doneRow(s)); }
  if (debt.length) { h += fold("debt", "🔴 Борги поруч", debt.length); if (S.open.debt) debt.forEach(s => h += rowHtml(s)); }
  if (skip.length) {
    h += fold("skip", "⏸ Не їдуть сьогодні", skip.length);
    if (S.open.skip) skip.forEach(s => h += `<div class="card wait"><b>${esc(s.name)}</b>${s.wait.map(w => `<div class="line"><span>№ ${esc(w.no)} · ${esc(w.why)} ${esc(w.when)}</span><span>${money(w.sum)}</span></div>`).join("")}</div>`);
  }
  return [h, [["back", "💸 Витрата", "expense"], ["go", "🏁 Здати касу", "close"]]];
}
function vCard(){
  const r = S.run, st = stop(), pos = r.order.indexOf(st.i);
  let h = pos >= 0 ? `<div class="small muted">Точка ${pos + 1} з ${r.order.length}</div><div class="bar"><u style="width:${100 * (pos + 1) / r.order.length}%"></u></div>` : `<div class="small muted">Борг без доставки</div>`;
  h += st.free && st.due <= 0 ? `<div class="big"><span class="nopay">Без оплати</span></div><div class="muted">так написав менеджер</div>` : `<div class="big">${money(st.due)}</div><div class="muted">💰 до збору</div>`;
  h += `<div class="card"><b class="h">📍 ${esc(st.name.toUpperCase())}</b>${st.addr ? `<div>${esc(st.addr)}</div>` : ""}
    ${st.comments.map(c => `<div>💬 «${esc(c)}»</div>`).join("")}
    ${st.flags.length ? `<div class="red"><b>❗ ${esc(st.flags.join(", "))}</b></div>` : ""}
    <div class="calls">${st.phones.length ? `<a class="btn go" ${telAttrs(st.phones[0])}>📞 Салон</a>` : `<span class="btn" style="opacity:.4">📞 Салон</span>`}
    ${mgrBtns(st) || `<button class="btn nophone" data-a="nophone" data-n="">📞 Менеджер</button>`}</div></div>`;
  if (st.ride.length) h += `<div class="card"><b class="h">📦 Сьогодні${st.free ? ` <span class="nopay">без оплати</span>` : ""}</b>

  savepick: () => { const typed = typedSum(); typed ? mark("amount", {sum:typed}) : mark("pick", {ks:S.sel}); },
  reasons: () => go("reasons"),
  none: d => { const st = stop(); S.why = d.r; if (["nomoney","atpoint","other"].includes(d.r) && st.debt > 0 && st.ride.length) return go("block"); mark("none", {reason:d.r}); },
  left: () => mark("none", {reason:S.why || "nomoney", left:false}),
  leftyes: () => mark("none", {reason:S.why || "nomoney", left:true}),
  problem: () => go("problem"),
  pother: async () => { if (await api("other", {i:S.i, kind:S.kind})) { S.psel = {}; toast("Записано: інший товар"); go("card"); } },
  kind: async d => { S.kind = d.k; S.psel = {}; const j = await api("items", {i:S.i}); if (j) { S.items = j.items; go("items"); } },
  item: d => { const n = +d.n; if (S.psel[n] !== undefined) delete S.psel[n]; else S.psel[n] = S.items[n].qty; render(true); },
  pqty: d => { const n = +d.n; S.itemN = n; S.item = S.items[n]; S.qty = S.psel[n] !== undefined ? S.psel[n] : S.item.qty; go("qty"); },
  pall: () => { const its = S.items || [], all = its.every((x, n) => S.psel[n] !== undefined);
    S.psel = {}; if (!all) its.forEach((x, n) => S.psel[n] = x.qty); render(true); },
  punsel: () => { delete S.psel[S.itemN]; go("items"); },
  qty: d => { S.qty = Math.max(1, Math.min(S.item.qty, S.qty + +d.d)); render(true); },
  saveproblem: () => { S.psel[S.itemN] = S.qty; go("items"); },
  saveproblems: async () => {       // одним запитом: або записались усі позиції, або жодна
    const rows = Object.keys(S.psel).map(n => ({ii:S.items[n].ii, li:S.items[n].li, qty:S.psel[n]}));
    const j = await api("problem", {i:S.i, kind:S.kind, rows});
    if (j) { S.psel = {}; buzz("success"); toast(`Записано позицій: ${j.n}`); go("card"); } },
  exp: d => { S.exp = d.k; render(true); },
  saveexp: async () => { if (await api("expense", {sum:S.sum, kind:S.exp})) { S.sum = ""; toast("Записано"); go("list"); } },
  expdel: async d => { await api("expense_del", {k:+d.k}); render(true); },
  hand: async () => {
    const d = S.day, args = S.cfg.daily && d ? {daily:{boxes:d.boxes, post:d.post || "0", ok:d.ok, car:d.car, desc:d.desc}} : {};
    const j = await api("close", args);
    if (j) { S.done = j.done; S.day = null; S.veh = null; buzz("success"); go("done"); } },
  veh: () => { S.veh = null; go("veh"); },
  vehtoggle: d => { S.veh = S.veh.includes(d.c) ? S.veh.filter(x => x !== d.c) : S.veh.concat(d.c); render(true); },
  saveveh: async () => { if (await api("vehicle", {codes:S.veh})) { S.veh = null; go("list"); } else render(true); },
  tomenu: async () => { if (await api("menu")) { S.veh = null; S.scr = "menu"; render(); } },
  today: () => go("day"),
  dayok: d => { S.day.ok = d.v === "1"; render(true); },
  daycar: d => { S.day.car = d.c; render(true); },
  exit: () => { tg && tg.close ? tg.close() : go("menu"); },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled || busy) return;
  if (el.dataset.a === "unsheet" && ev.target !== el && !ev.target.closest("button")) return;
  buzz();
  const f = A[el.dataset.a];
  if (f) f(el.dataset);
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (S.day && (id === "boxes" || id === "post")) { S.day[id] = ev.target.value = ev.target.value.replace(/\D/g, "").slice(0, 4); updDay(); }
  if (S.day && id === "desc") { S.day.desc = ev.target.value; updDay(); }
});
document.addEventListener("input", ev => { if (ev.target.id === "sum") { S.sum = ev.target.value.replace(/[^\d.,\s]/g, ""); if (S.scr === "pick") updPick(); } });

(async function boot(){
  try {
    if (tg) {
      tg.ready(); tg.expand();
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();      // свайп униз не закриває рейс посеред роботи
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg);
      tg.BackButton.onClick(() => { if (BACK[S.scr]) go(BACK[S.scr]); else if (S.scr === "menu" && S.run) go("list"); });
    }
  } catch(e){}
  const j = await api("state");
  if (S.scr === "shut") return;
  if (!j && !S.run && !S.menu) { $("main").innerHTML = `<div class="center"><div style="font-size:48px">🔒</div><p><b>Рейс відкривається кнопкою в боті.</b></p></div>`; return; }
  go(S.run ? "list" : "menu");
  // Екіпаж із двох: список сам підтягує відмітки напарника, поки ти на нього дивишся
  setInterval(async () => {
    if (busy || document.hidden || S.scr !== "list" || !S.run || !(S.run.crew && S.run.crew.length > 1)) return;
    const ver = S.run.ver, was = !!S.run;
    try {
      const r = await fetch("api", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({init:INIT, act:"state", args:{}})});
      const j = await r.json();
      if (busy || S.scr !== "list" || !j.ok) return;
      if (!j.run) { S.run = null; if (j.menu) S.menu = j.menu; toast("Напарник здав касу"); return go("menu"); }
      if (j.run.ver !== ver) { S.run = j.run; render(true); }
    } catch(e){}
  }, 25000);
})();
</script>
